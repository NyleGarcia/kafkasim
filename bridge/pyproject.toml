[project]
name = "kafkasim-bridge"
version = "0.1.0"
description = "Stream real Apache Kafka cluster state to the kafkasim UI, or record it for replay"
readme = "README.md"
authors = [
    { name = "Nyle Garcia", email = "nylegarcia01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "websockets>=17.4",
]

[project.scripts]
kafkasim-bridge = "kafkasim_bridge.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # formatter wraps code; long strings stay readable
